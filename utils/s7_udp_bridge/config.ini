[plc]
# PLC 硬件连接信息
ip_address = 192.168.1.8
port = 102
rack = 0
slot = 0 

[udp]
# 目的上位机监听端地址和端口（即 daemon_gpio.py 监听的 read_port）
dest_ip = 127.0.0.1
dest_port = 11451

[polling]
# 轮询时间间隔（毫秒）。建议设为 50ms。
interval_ms = 20 

[heartbeat]
# ----------------------------------------------------
# 心跳节拍（毫秒）。控制 UDP Bitmap 的发送策略
# ----------------------------------------------------
# 0 = 禁用 (默认), 仅在 UDP Bitmap 发生变化时才 sendto, 网络最干净.
# N > 0 = 兜底发送: 无变化时每 N 毫秒照样发一次同样的 UDP 包.
#          用来保活 NAT / 防火墙 UDP 流, 或调试时强制看上位机是否在线.
#
# 设 ≤ polling.interval_ms 时等同于「每轮都发」(老式行为, 一般不推荐).
# 建议: 现场无 NAT 走 0; 走公网/VPN 给 1000~3000.
#
# 优先级: --heartbeat-ms 命令行参数 > 本配置项 > 默认 0
interval_ms = 1000

[bit_mappings]
# ----------------------------------------------------
# 比特粒度批量映射（主力映射，人类友好的写法）
# ----------------------------------------------------
# 只需填 3 个 Key，自动算出末位对应：
#   源线性位 0..222   →  DB10.DBX0.0 .. DB10.DBX27.6
#   目的线性位 16..238 → I2.0 .. I29.6
Start_Mapping_I  = I2.0
Start_Mapping_DB = DB10.DBX0.0
Mapping_Count    = 223

[db_mappings]
# ----------------------------------------------------
# 字节粒度批量映射（备选；与 bit_mappings 并存时 bit_mappings 优先级更高）
# ----------------------------------------------------
# 语法: 任意键名 = DB号, PLC起始字节, 读取长度(字节), 填充到UDP_Bitmap的起始字节
#
# 范例：一次性读取 DB10.DBB0..DBB27 (28 字节), 直接复制到 UDP[0..27]
# db_map_1 = 10, 0, 28, 0

[fine_mappings]
# ----------------------------------------------------
# 单点位自由映射（任意区域点位跨界投射；落点在 bit/db 覆盖范围内自动复用内存）
# ----------------------------------------------------
# 语法: PLC物理点位 = 上位机虚拟I点 (格式 I{byte}.{bit})

# 1. DBX 跨界、不规则飘移映射:
# DB11.DBX12.4 = I10.3   ; DB11.DBX12.4 -> I10.3

# 2. 物理输出 Q 点监控（验证接触器、阀是否真正得电动作）:
# Q0.0 = I28.2           ; Q0.0 -> I28.2

# 3. 内部状态位 M 点监控:
# M4.5 = I28.3           ; M4.5 -> I28.3

# 4. 物理输入 I 点飘移重写:
# I1.2 = I28.4           ; I1.2 -> I28.4
